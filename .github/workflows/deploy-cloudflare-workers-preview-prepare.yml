name: Cloudflare Workers (Preview) Prepare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # PR code builds here without Cloudflare credentials or a write-capable token.
      - uses: ./.github/actions/build-cloudflare-sandbox
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-sandbox
          path: packages/sandbox/dist-cloudflare
          if-no-files-found: error
          retention-days: 7
      - name: Persist checkout metadata
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          await writeFile('preview-meta.json', JSON.stringify({
            prNumber: process.env.PR_NUM,
            headSha: process.env.HEAD_SHA,
          }))
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: preview-meta
          path: preview-meta.json
          if-no-files-found: error
          retention-days: 7
