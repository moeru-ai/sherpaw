name: Deploy Cloudflare sandbox
description: Upload validated static assets with the trusted sandbox Worker configuration.
inputs:
  command:
    description: Trusted Wrangler deploy or versions upload command.
    required: true
  api-token:
    description: Cloudflare API token.
    required: true
  account-id:
    description: Cloudflare account ID.
    required: true
outputs:
  url:
    description: URL returned by Wrangler.
    value: ${{ steps.deploy.outputs.deployment-url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
    # Preinstall Wrangler as in AIRI; do not let the action install into the workspace.
    - run: npm install --global wrangler@4.136.3
      shell: bash
    - run: node .github/scripts/validate-cloudflare-assets.mjs packages/sandbox/dist-cloudflare
      shell: bash
    - id: deploy
      uses: cloudflare/wrangler-action@v4
      with:
        packageManager: npm
        apiToken: ${{ inputs.api-token }}
        accountId: ${{ inputs.account-id }}
        command: ${{ inputs.command }}
