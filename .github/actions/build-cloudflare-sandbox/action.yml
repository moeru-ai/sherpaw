name: Build Cloudflare sandbox
description: Build the sandbox with pinned external models and check static asset limits.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: node --test .github/scripts/cloudflare.test.mjs
      shell: bash
    - run: pnpm --filter '@sherpaw/sandbox^...' build
      shell: bash
    - run: pnpm -F @sherpaw/sandbox build:cloudflare
      shell: bash
    - run: node .github/scripts/validate-cloudflare-assets.mjs packages/sandbox/dist-cloudflare
      shell: bash
